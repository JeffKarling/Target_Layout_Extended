site_name: Target Layout Extended
site_url: https://jeffkarling.github.io/Target_Layout_Extended/
site_dir: site
docs_dir: Documentation
repo_url: https://github.com/JeffKarling/Target_Layout_Extended

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - navigation.top

markdown_extensions:
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - How it works: index.md
  - Component boundaries and catalogs: component_boundaries.md
  - Journal developer guide: journal_developer_guide.md
  - Adding a component: adding_a_component.md
  - Benchmarking and score optimization: benchmarking_and_profiling.md
  - Journal performance comparison: journal_performance_comparison.md
  - Presets and multi compiler workflow: presets_and_compilers.md
  - Static analysis and deep debug: static_analysis_and_debug.md
  - Runtime sanitizers: sanitizer_guide.md
