site_name: Target Layout Extended
site_url: https://jeffkarling.github.io/Target_Layout_Extended/
site_dir: site
docs_dir: Documentation
repo_url: https://github.com/JeffKarling/Target_Layout_Extended

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - How it works: index.md
  - Component boundaries and catalogs: component_boundaries.md
  - Journal developer guide: journal_developer_guide.md
  - Adding a component: adding_a_component.md
  - Benchmarking and hardware performance baselines: benchmarking_and_profiling.md
  - Journal performance comparison: journal_performance_comparison.md
  - Presets and multi compiler workflow: presets_and_compilers.md
  - Static analysis and deep debug: static_analysis_and_debug.md
  - Runtime sanitizers: sanitizer_guide.md
  - Engineering standards:
      - Overview: standards/index.md
      - Mandatory angle bracket includes: standards/mandatory_angle_bracket_includes.md
      - Scott Meyers interface design: standards/meyers_interface_design.md
      - Ranges and memoryless views: standards/ranges_and_views.md
      - Boundary exceptions and catalogs: standards/boundary_exceptions_and_catalog_logging.md
      - Generous structured logging: standards/generous_structured_logging.md
      - Component segmentation: standards/component_segmentation_opportunities.md
      - Shared target overrides: standards/override_shared_target_defaults.md
      - Mandatory test updates: standards/mandatory_test_updates.md
      - Mandatory benchmark verification: standards/mandatory_benchmark_verification.md
      - Function multi versioning and target clones: standards/function_multi_versioning_and_target_clones.md
      - Documentation and writing style: standards/documentation_and_natural_writing.md
