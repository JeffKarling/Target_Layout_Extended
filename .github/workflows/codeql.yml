name: "CodeQL Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: CodeQL Static Analysis
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Install Fedora toolchain and dependencies
        run: |
          dnf install -y \
            gcc-c++ clang cmake ninja-build \
            pkgconf-pkg-config protobuf-compiler protobuf-devel \
            tbb-devel systemd-devel gtest-devel git

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f779452ac5af1c261dce0346a8f964149f49322b # v3.26.13
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build target components
        run: |
          cmake --preset GNU_Default_Release
          cmake --build --preset GNU_Default_Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f779452ac5af1c261dce0346a8f964149f49322b # v3.26.13
        with:
          category: "/language:c-cpp"
